
name: Kids World Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android and Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android and Web platform files
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.kidsworld --project-name kids_world_platform .
          fi

          if [ ! -d web ]; then
            flutter create --platforms=web .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Web
        run: flutter build web --release

      - name: Upload Android and Web builds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kids-world-builds
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/web/
          if-no-files-found: warn
          
